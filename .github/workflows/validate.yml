name: Validate rule distribution
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check generated distribution
        run: python3 scripts/generate.py --check
      - name: Test generation and validation
        run: python3 -m unittest discover -s tests -v
